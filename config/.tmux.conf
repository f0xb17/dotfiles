# Destroy a session when its last client detaches
set -g destroy-unattached on

# Don't automatically detach when the last window closes
set -g detach-on-destroy off

# Keep default prefix Ctrl+B
set -g prefix C-b

# Splitting (preserve current directory)
bind h split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# Ctrl+B, then a → Previous window (left)
bind a previous-window

# Ctrl+B, then d → Next window (right)
bind d next-window

# Show all active tmux sessions
bind s choose-tree -s

# Ctrl+B, then n → Create a new window
bind n new-window -c "#{pane_current_path}"
