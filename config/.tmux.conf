# ── Terminal ────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-ghostty:RGB'

set -g mouse on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on

# ── Session Management ──────────────────────────────

# Destroy a session when its last client detaches
set -g destroy-unattached on

# Don't automatically detach when the last window closes
set -g detach-on-destroy off

# ── Transparency ────────────────────────────────────
set -g window-style 'bg=default'
set -g window-active-style 'bg=default'

# ── Keybindings ─────────────────────────────────────

# Keep default prefix Ctrl+B
set -g prefix C-b

# Splitting (preserve current directory)
bind h split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# Ctrl+B, then a → Previous window (left)
bind a previous-window

# Ctrl+B, then d → Next window (right)
bind d next-window

# Show all active tmux sessions
bind s choose-tree -s

# Ctrl+B, then n → Create a new window
bind n new-window -c "#{pane_current_path}"

# ── Tokyo Night Rounded Status Bar ───────────────────

set -g status-position top

set -g status on
set -g status-interval 5
set -g status-justify left

# Transparent background
set -g status-style 'bg=default,fg=#c0caf5'

# Status widths
set -g status-left-length 40
set -g status-right-length 40

# ── Session Pill ─────────────────────────────────────

set -g status-left '#[fg=#7aa2f7,bg=default]#[fg=#1a1b26,bg=#7aa2f7,bold] 󰆍 #S #[fg=#7aa2f7,bg=default,nobold]#[default] '

# ── Window Pills ─────────────────────────────────────

# Neutralize inherited formatting
set -g window-status-style 'fg=#c0caf5,bg=default'
set -g window-status-current-style 'fg=#c0caf5,bg=default'
set -g window-status-activity-style 'none'
set -g window-status-bell-style 'none'
set -g window-status-last-style 'none'

# Disable automatic window flags
set -g window-status-activity-style 'fg=#c0caf5,bg=default'
set -g window-status-bell-style 'fg=#c0caf5,bg=default'

# Consistent spacing between all windows
set -g window-status-separator ' '

# Inactive window
set -g window-status-format '#[fg=#3b4261,bg=default]#[fg=#c0caf5,bg=#3b4261] #I:#W #[fg=#3b4261,bg=default]#[default]'

# Active window
set -g window-status-current-format '#[fg=#7aa2f7,bg=default]#[fg=#1a1b26,bg=#7aa2f7,bold] #I:#W #[fg=#7aa2f7,bg=default,nobold]#[default]'

# ── Clock Pill ───────────────────────────────────────

set -g status-right '#[fg=#7dcfff,bg=default]#[fg=#1a1b26,bg=#7dcfff,bold] 󰥔 %H:%M #[fg=#7dcfff,bg=default,nobold]#[default]'

# ── Pane Borders ─────────────────────────────────────

set -g pane-border-style 'fg=#3b4261'
set -g pane-active-border-style 'fg=#7aa2f7'

# ── Messages ─────────────────────────────────────────

set -g message-style 'bg=#24283b,fg=#c0caf5'
set -g message-command-style 'bg=#24283b,fg=#7aa2f7'
