# Claude Dark
# Based on cyNew/claude-theme-vscode
# https://github.com/cyNew/claude-theme-vscode

# ─────────────────────────────────────────────
# UI
# ─────────────────────────────────────────────

"ui.background" = { fg = "foreground", bg = "background" }
"ui.background.separator" = "border"

"ui.cursor" = { fg = "background", bg = "accent" }
"ui.cursor.normal" = { fg = "background", bg = "accent" }
"ui.cursor.insert" = { fg = "background", bg = "bright-yellow" }
"ui.cursor.select" = { fg = "background", bg = "purple" }
"ui.cursor.primary" = { fg = "background", bg = "accent" }

"ui.linenr" = "bright-black"
"ui.linenr.selected" = { fg = "foreground", bg = "background" }

"ui.gutter" = { bg = "background" }
"ui.gutter.selected" = { bg = "background" }

"ui.statusline" = { fg = "foreground", bg = "black" }
"ui.statusline.inactive" = { fg = "bright-black", bg = "black" }
"ui.statusline.normal" = { fg = "foreground", bg = "black" }
"ui.statusline.insert" = { fg = "background", bg = "accent" }
"ui.statusline.select" = { fg = "background", bg = "purple" }

"ui.popup" = { fg = "foreground", bg = "black" }
"ui.help" = { fg = "foreground", bg = "black" }

"ui.menu" = { fg = "foreground", bg = "black" }
"ui.menu.selected" = { fg = "background", bg = "accent" }

"ui.text" = "foreground"
"ui.text.focus" = { fg = "bright-white", bg = "black" }
"ui.text.inactive" = "bright-black"

"ui.selection" = { bg = "selection" }
"ui.cursorline" = { bg = "cursorline" }

"ui.window" = "border"

"ui.virtual" = "bright-black"
"ui.virtual.whitespace" = "bright-black"
"ui.virtual.indent-guide" = "border"
"ui.virtual.inlay-hint" = "bright-black"

# ─────────────────────────────────────────────
# Diagnostics
# ─────────────────────────────────────────────

"diagnostic.error" = { fg = "red", underline = { color = "red", style = "curl" } }
"diagnostic.warning" = { fg = "yellow", underline = { color = "yellow", style = "curl" } }
"diagnostic.info" = { fg = "blue", underline = { color = "blue", style = "curl" } }
"diagnostic.hint" = { fg = "cyan", underline = { color = "cyan", style = "curl" } }

"error" = "red"
"warning" = "yellow"
"info" = "blue"
"hint" = "cyan"

# ─────────────────────────────────────────────
# Syntax
# ─────────────────────────────────────────────

"comment" = { fg = "bright-black", modifiers = ["italic"] }

"constant" = "yellow"
"constant.numeric" = "yellow"
"constant.character" = "yellow"
"constant.builtin" = "yellow"

"string" = "green"
"string.regexp" = "green"
"string.special" = "bright-green"

"variable" = "foreground"
"variable.builtin" = "accent"
"variable.parameter" = "foreground"

"type" = "blue"
"type.builtin" = "bright-blue"
"type.parameter" = "blue"

"constructor" = "blue"

"function" = "accent"
"function.builtin" = "accent"
"function.method" = "accent"
"function.macro" = "purple"

"keyword" = "purple"
"keyword.control" = "purple"
"keyword.function" = "purple"
"keyword.return" = "purple"
"keyword.operator" = "bright-purple"
"keyword.storage" = "purple"

"operator" = "foreground"

"punctuation" = "foreground"
"punctuation.delimiter" = "bright-black"
"punctuation.bracket" = "foreground"

"attribute" = "yellow"
"namespace" = "blue"
"label" = "purple"

"tag" = "blue"
"tag.error" = "red"

# ─────────────────────────────────────────────
# Markup
# ─────────────────────────────────────────────

"markup.heading" = { fg = "accent", modifiers = ["bold"] }
"markup.heading.marker" = "bright-black"

"markup.bold" = { modifiers = ["bold"] }
"markup.italic" = { modifiers = ["italic"] }
"markup.strikethrough" = { modifiers = ["crossed_out"] }

"markup.link.url" = { fg = "blue", modifiers = ["underlined"] }
"markup.link.text" = "accent"
"markup.link.label" = "green"

"markup.quote" = "green"
"markup.raw" = "yellow"
"markup.raw.inline" = "yellow"
"markup.raw.block" = "yellow"

# ─────────────────────────────────────────────
# Diff
# ─────────────────────────────────────────────

"diff.plus" = "green"
"diff.minus" = "red"
"diff.delta" = "yellow"

# ─────────────────────────────────────────────
# Palette
# ─────────────────────────────────────────────

[palette]

background = "#262626"
foreground = "#c3c1ba"

accent = "#d87757"

black = "#1b1b1b"
red = "#f14444"
green = "#8fba6a"
yellow = "#e89b76"
blue = "#5cacde"
purple = "#b39cf5"
cyan = "#4ec2c2"

bright-black = "#6b6961"
bright-red = "#f46868"
bright-green = "#a5d082"
bright-yellow = "#d87757"
bright-blue = "#7ec0ea"
bright-purple = "#c9b5f9"
bright-cyan = "#6ed6d6"
bright-white = "#faf8f1"

white = "#c3c1ba"

border = "#3d3d3d"
selection = "#6f4a3c"
cursorline = "#2d2d2d"
